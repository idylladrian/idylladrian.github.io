		<script>
			function make_side_numbering(up_to) {
				// simple loop to make an array of number strings for HTML
				const numbering = document.getElementById("numbering");
				let numString = "";
				let i = 0;
				while (i < up_to) {
					numString = numString + i + "<br>";
					i++;
				};

				numbering.innerHTML = numString;
			}

			function delay(ms) {
				// create a function that delays actions by an amount of time passed through
				return new Promise(resolve => setTimeout(resolve, ms));
			}

			function type_text(full_string, element, step, delay_ms, cursor_class) {
				// create a recursive function to be called at each animation frame
				if (step < full_string.length) {
					element.textContent = full_string.substring(0, step)+"|";
				} else {
					element.textContent = full_string;
				}

				if (step >= full_string.length) {
					// create a blinking cursor to add when everything is done
					const blinking_cursor = document.createElement("blinking_cursor");
					blinking_cursor.textContent = "|";
					// assign it a class name that it will look for in the CSS document
					blinking_cursor.className = cursor_class;
					element.appendChild(blinking_cursor);
				}

				step++;

				if (step <= full_string.length) {
					delay(delay_ms).then(() => {
						requestAnimationFrame(() => {type_text(full_string, element, step, delay_ms, cursor_class)
								}
							);
					});
					return element
				}
			}

			function repeat_HTML(full_string, element, step, delay_ms, cursor_class) {
				// create a recursive function to be called at each animation frame
				if (step < full_string.length) {
					element.innerHTML = full_string.substring(0, step)+"|";
				} else {
					element.innerHTML = full_string;
				}

				if (step >= full_string.length) {
					// create a blinking cursor to add when everything is done
					const blinking_cursor = document.createElement("blinking_cursor");
					blinking_cursor.textContent = "|";
					// assign it a class name that it will look for in the CSS document
					blinking_cursor.className = cursor_class;
					element.appendChild(blinking_cursor);
				}

				step++;

				if (step <= full_string.length) {
					delay(delay_ms).then(() => {
						requestAnimationFrame(() => {repeat_HTML(full_string, element, step, delay_ms, cursor_class)});
					});
				} else {
					step = 0;
					requestAnimationFrame(() => {repeat_HTML(full_string, element, step, delay_ms, cursor_class)});
				}
			}

			const code_element = document.getElementById("fake-code");

			const header_element = document.getElementById("header-type");
			const header_text = "C0DING: Humanity's Shortest-Lived Art Form";

			const note_element = document.getElementById("note-text-1");
			const note_text = "*I could not figure out how to do the animation while also italicizing text and doing indents, so imagine the underscores are indents and ALL CAPS are italicizations"
			note_element.className = "note-formatting"
			type_text(note_text, note_element, 0, 1, "blink-p")

			const body_1_element = document.getElementById("body-text-1");
			const body_1_text = `____Writing is thinking. The process of writing requires recursive attention to make something coherent and compelling. You write a few sentences and ask yourself "and then what?" or "is it crazy to say that?" And because you comb through every detail of what you are processing, you either emerge at a conclusion with a more rigorous stance behind your point of view or you've changed your mind completely. I think this is amazing because I can't name too many ways to get people to change their minds (maybe the power of love?). And this quality of writing is what I fear is being lost when I see how AI and Large-Language Models (LLMs) are replacing people's desire to make their own work.`
			type_text(body_1_text, body_1_element, 0, 1, "blink-p");

			const body_2_element = document.getElementById("body-text-2");
			const body_2_text = `____It is strange to reflect on about how quickly AI has invaded our lives and conversations. People heard that there was a new machine that could write for you—--think for you---and many didn't hesitate before using it wherever they could. I can't even say that I am an AI-less saint. I have had days where I stumble into the office on three hours of sleep, find myself fighting the urge to type ever-more specific questions into Google so that Gemini will tell me exactly what I need to do to make it to five PM. And it makes sense; thinking has been set up as a serious inconvenience in years leading up to the AI boom. For the last decade, we've had our thoughts influenced by algorithms in thousands of social media posts and advertisements. Algorithmic feeds have unwittingly sculpted our attention spans and desires for so long that we were fully primed for when OpenAI unleased their product to the world. Even before the current era of inescapable content curation, most Americans go though a punishing education system that leaves most uninterested in reading---let alone writing---for many years afterward they graduate.`
			type_text(body_2_text, body_2_element, 0, 2, "blink-p");

			const body_3_element = document.getElementById("body-text-3");
			const body_3_text = `____In school, my education was frequently defined in terms of some vague goals detached from what would actually impress its value onto me. In lit art class, I was asked to achieve certain criteria in my schoolwork to show that I was writing at grade-level ("To receive a passing grade, your essay will need to have the following structural elements..." or "You will need to craft an argument that supports a point of view by..."). Most adults educated in the United States have been taught that learning, and especially writing, is about the results and not anything that could be gleaned from the process itself. The result-oriented mindset of Americans is then sustained in our work-lives as we are rewarded for outcomes that make money and punished for expending energy that doesn't do so. "Process" is not rewarded in a job. An ideal world for companies and capitalists is one that has all profits and no expenses to achieve them. The promise of eliminating one of the most expensive processes that has yet to be automated, thinking, is what makes AI so enticing. Our culture believes that thinking is expensive (and it is true! did you know that the brain uses 20% of the body's total energy everyday?), but the expense is only a burden if you focus on wealth or test scores. The writing process, which IS thinking, can provide you clarity of the world and your life. Because there is no explicit financial reward for it, it is considered of no value to a capitalist economy and even detrimental to its inhumane goals.`
			type_text(body_3_text, body_3_element, 0, 4, "blink-p");

			const body_4_element = document.getElementById("body-text-4");
			const body_4_text = `____Another side effect of the cultural disinterest in writing and its process is a structural inability for people to develop critical thinking. Process is a requirement to seriously questioning our world because it is usually insufficient to just ponder about something in our heads and reach a new understanding. The mind is fickle and ruminating does not challenge our world views as much as we would like to think that it does. Moving our thoughts outside of our body so that we can scrutinize them and be slow in digesting them is what gives us comprehension, helps us connect dots, and develop imagination. Writing is not the only practice that does this. Outside of writing, I make paintings and drawings to help me understand life experiences when words fail to do so. Working through process leads to understandings that we could not reach by cheating our way to the answer, and this is what we lose when we defer questions to AI. Everytime an LLM is used to shortcut work, time may be saved (which isn't even always true with how inaccurate AI results can be), but any kind of psychological/spiritual/emotional/intellectual growth is denied. If you cannot develop an ability to engage with any kind of mental rigor for even small tasks, why would you be able to engage with more consequential and complex problems? If you can't focus for five minutes to read a news article (occasionally guilty), then how could you trust yourself to fully intellectually explore situations more complex and dire? If you do not have a regular practice of some kind of processing and creating, then how can you reliably know that you are critically thinking about anything?`
			type_text(body_4_text, body_4_element, 0, 8, "blink-p");

			const body_5_element = document.getElementById("body-text-5");
			const body_5_text = `____Even if the landscape of writen works is changing, we are so fortunate to have an abundance of writings to enjoy from history and hopefully from artists who will continue publishing work for many years. I am pessimistic about what the upcoming generation will have to deal with if they want to write, but at least there is no shortage of inpsiration to enjoy and nourish them. I also believe that writing and creating is contagious and too many people are still doing it (including yours truly)! However, the AI industry does not limit its ambitions to written words, it also seeks to monopolize on all forms of creating. One of its most-prized targets is one that many don't even realize to be a creative form: coding.`
			type_text(body_5_text, body_5_element, 0, 16, "blink-p");

			const body_6_element = document.getElementById("body-text-6");
			const body_6_text = `____Modern coding has really only existed since the mid 1900s, with the fun visual-screen stuff coming around towards the latter half of the century. Since then, we have had many nerds using computers to create whatever their hearts desire. Coding, being a practice only a couple generations old, does not have a reputation for being a creative form. It is still largely understood by nerds and people with access to education for it--like how writing and reading were at many points in human history. It is not straightforward to communicate your ideas to computers; similar to how it is not straightforward to communicate your ideas to people. There are constraints in computer syntax like there are in English that serve as boundaries to what you can communicate. Not writing well will make it difficult for the reader to understand; like poor coding will make it difficult for a computer to understand. Additionally, if you have a concept in your head that you want to realize, you have many directions to do so on a computer. In fact, the creative flexibility in code-writing has been leveraged by educators for many years to check student work. In my college, it was very easy to compare student-code to look for plagiarism between peers. Even in a class of 400 freshman who all received the same task, individual coding styles and thought-processes are so distinct that you can reliably tell if someone copied another's work using a special program. If you haven't coded, I bet you didn't know that! And the uniqueness in style between people is due to the limitations you have in programming. Everyone who approaches a computer has their own idea of how to make something with a limited computer vocabulary; like how I have my own way of painting with a small set of pigments or my friends can make beautiful poems with few words. Everytime I code, as I did with this HTML page, I am spending hours trying to get a computer to understand my vision. I am researching CSS properties and their mechanisms. I look for other websites for inspiration and to inspect their backend code to see what I can learn. When I am developing a JavaScript code to plug into my webpage to make it do special animations, it takes many rounds of analyzing and critiquing what I'm typing to understand why it's not working or how it could be made better. And after I have moved through the coding process, I know so much more than I did before and have developed a larger imagination for problem-solving through algorithms. Thus coding is a creative process and its creative components are lost when you give over your vision to an LLM.`
			type_text(body_6_text, body_6_element, 0, 32, "blink-p");

			const body_7_element = document.getElementById("body-text-7");
			const body_7_text = `____The ease of removing process from coding is why I feel like the future of potential works made with computers has been seriously altered. AI has already made seismic impacts on the computer science and coding world. You cannot talk about software without talking about AI and how it could be integrated into whatever you are making. It is in our educational programs, our social media content, and every inch of the workplace. If you have any interest in getting into coding, you will search for resources and immediately be innundated with suggestions and guides on how to use Claude or some other model to "help" you learn---to "help" you solve problems that you now will never actually be able to solve because you aren't truly learning. Beyond convenience, there are people who don't even believe in any kind of mental strain when doing software design. "Vibe coding" is a new term that refers to producing code solely by asking an LLM to write and change code for you. I'm sure there is a serious programmer here and there that does it, but it is primarily for entrepeneurs who want to stroke their ego. It is well known amongst people who like to code that what is made by LLMs is a mess. It might get the job done but it is a shitshow behind the scenes. What you get is analogous to the slop that would be made if you asked ChatGPT to write a book. This is to say that AI is completely embraced by people who like the idea of coding (not by people who like TO code) because it makes people THINK that they're achieving impressive programming feats. Businessmen THINK that they are architecting software. Managers THINK that they are increasing staff productivity tenfold. And losers who want to be the next Bill Gates THINK they're getting closer to being a supergenius. Because coding is a creative form, it is not easily recognizeable to the layman what good quality coding is or what it would entail. It is the same reason why so many people struggle with complex literature and abstract art. If you don't have a background or education in an particular area of art, you might have difficulty understanding things made by people who spend their whole lives entrenched in what they make. And so capitalists, being that they see coding as completely utilitarian and solely requiring logic, don't understand that humanity is what makes it work. Computers don't need code to work, they only need strings of 1s and 0s that are illegible to humans. Furthermore, they don't do anything by themselves; we built them and our approval of their function is sourced from our own desires. People made coding languages so that we could makes 1s and 0s in a way that made sense to us, so now operating systems will forever need a human touch to function. But because it is so easy to FEEL like you're coding and the code does/can work with AI, I worry that significantly less people will bother with learning how to program. The current corporate landscape, which unfortunately leads the overall culture in America, is attempting to do away with investing any resources in computer education. Whether it is actually feasible to do so, is a separate question, but I believe the attempt will change the direction of learning for generations.`
			type_text(body_7_text, body_7_element, 0, 64, "blink-p");

			const body_8_element = document.getElementById("body-text-8");
			const body_8_text = `____Despite how bleak my fears of AI are, I don't truly believe that coding will die as an art form. There are still lots of young people reading and making art for pleasure---even though I was once convinced that TikTok would take away people's interest in doing anything beside watching short videos. It is difficult right now to assess what effect LLMs will have on our culture. The fad could pass, everyone could get fed up one day, and OpenAI goes out of business (mmm, nice thought huh?). But nerds persist and in every generation, there will always be some middle schoolers getting bullied who can only find emotional solace in drawing hentai and reading the Great Gatsby. I feel confident that I will continue to meet younger people who learn coding despite it being more inconvenient than it has ever been. But I lament a lost future where coding was not only for the nerds. There could have been a future where it was just something that most people had access to as a creative outlet; like when my friends write a poem on a napkin or when I'm shown a doodle in someone's sketchbook. Whatever the kids are gonna get up to, it will less likely be coding. And it's not just programming: all kinds of creative practices are being threatened. Even if this iteration of capitalist-innovation doesn't succeed in taking over thinking and creative process, it is always a goal for the people chasing wealth. A new threat to imagination and life will come again with a new face and a new tool, but it will have the same goal of taking away our collective humanity and desire to make new things. And so we must create! Continuing to make art and engage in process not only resists dehumanization but also changes ourselves for the better. Creating refines ourselves and our desires, and that is how we continue to shape the future. What kind of future are you making? What's your process? I still make my world---I made this webpage---so maybe what comes next is not yet decided.`
			type_text(body_8_text, body_8_element, 0, 128, "blink-p");
			
			// add_text(body_1_text, body_1_element, 0, 2, "blink-p");

			// const tooltip_1_image_url = "https://i.ytimg.com/vi/4ZWaJJpgygM/maxresdefault.jpg";
