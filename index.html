	<!-- Below are javascripts for my fun little popups. I kept them here because why not? -->
	
	
	<script>	
	// This one is for the audio button that plays whatever is going on. 
		const audioButton = document.querySelector('.btn-audio');
		let audioInstance;

		audioButton.addEventListener('click', function() {
			if (!audioInstance) {
				audioInstance = new Audio(this.getAttribute('data-audio'));
				audioInstance.loop = this.getAttribute('data-loop') === 'true';
			}

			if (audioInstance.paused) {
				audioInstance.play();
				this.classList.remove('is-inactive');
				this.classList.add('is-active');
			} else {
				audioInstance.pause();
				this.classList.remove('is-active');
				this.classList.add('is-inactive');
			}
		});
	</script>
	
	<script>
		const popupButton = document.getElementById('popupButton');
		const popup = document.getElementById('popup');
		const closePopup = document.getElementById('closeButton');
		const popupOverlay = document.getElementById('popupOverlay');
		
		// Initialize the audio instance
		const popupAudio = new Audio('audio/Never-Gonna-Give-You-Up.mp3'); // Replace with your audio URL
		popupAudio.loop = true; // Enable looping if desired

		popupButton.addEventListener('click', function() {
			popup.style.display = 'block';
			popupOverlay.style.display = 'block';
			popupAudio.play(); // Play audio
		});

			// Close popup and stop audio
		const closePopupHandler = function() {
			popup.style.display = 'none';
			popupOverlay.style.display = 'none';
			popupAudio.pause(); // Pause audio
			popupAudio.currentTime = 0; // Reset audio to start
		};

		closePopup.addEventListener('click', closePopupHandler);
		popupOverlay.addEventListener('click', closePopupHandler);
	</script>
	
	<script>
		const popupButtonVirus = document.getElementById('popupButtonVirus');

		popupButtonVirus.addEventListener('click', function() {
			popupVirus.style.display = 'block';
			popupOverlayVirus.style.display = 'block';
		});

			// Close popup and stop audio
		const closePopupHandlerVirus = function() {
			popupVirus.style.display = 'none';
			popupOverlayVirus.style.display = 'none';
		};

		closePopupVirus.addEventListener('click', closePopupHandlerVirus);
